# include:
#   - remote: https://raw.githubusercontent.com/actionplatform/ci-gitlab/v1/ci.yml
#
# Then extend the job templates below as jobs named gitflow and conventional-commit. Images per language:
#   python:3.12  golang:1.23  node:20  composer:2  maven:3-eclipse-temurin-17  rust:1.80
#   csharp: mcr.microsoft.com/dotnet/sdk:9.0  elixir: elixir:1.18  swift: swift:6.0
#   scala: sbtscala/scala-sbt:eclipse-temurin-17.0.13_11_1.10.5_3.5.2

variables:
  AP_SCRIPTS: "https://raw.githubusercontent.com/actionplatform/ci-scripts/v1"

.ap-scripts:
  before_script:
    - command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl; }; mkdir -p .ap && for s in lib setup check release conventional-commit gitflow gitflow-pr; do curl -fsSL "$AP_SCRIPTS/$s.sh" -o ".ap/$s.sh"; done && chmod +x .ap/*.sh

.ap-check:
  extends: .ap-scripts
  stage: test
  script:
    - .ap/setup.sh
    - .ap/check.sh

.ap-conventional-commit:
  extends: .ap-scripts
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: 0
  script:
    - AP_BASE="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" .ap/conventional-commit.sh

.ap-gitflow:
  extends: .ap-scripts
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - AP_HEAD="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" AP_BASE="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" AP_DEFAULT_BRANCH="$CI_DEFAULT_BRANCH" .ap/gitflow-pr.sh

.ap-release:
  extends: .ap-scripts
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - git remote set-url origin "https://oauth2:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - AP_TAG="$CI_COMMIT_TAG" AP_BRANCH="$CI_DEFAULT_BRANCH" .ap/release.sh
